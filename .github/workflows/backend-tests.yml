name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep this unfiltered: new unit/interface/NFR suites must also run.
          - suite: all
            command: npm test -- --ci --runInBand --coverageDirectory=coverage/all
          - suite: no-mock
            command: npm run test:no-mock -- --ci
          - suite: mock
            command: npm run test:mock -- --ci
          - suite: interface
            command: npm run test:interface -- --ci
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Run tests and record environment
        env:
          TEST_COMMAND: ${{ matrix.command }}
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            node --version
            npm --version
            printf '%s\n' "$TEST_COMMAND"
          } > test-results/environment.txt
          # bash pipefail preserves Jest's failure status while tee retains its output.
          $TEST_COMMAND --json --outputFile=test-results/results.json 2>&1 | tee test-results/console.txt
      - name: Save test results and coverage even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-${{ matrix.suite }}-${{ github.sha }}
          path: |
            backend/test-results/
            backend/coverage/
          retention-days: 30
          if-no-files-found: warn
