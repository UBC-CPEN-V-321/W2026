# Throwaway MongoDB used only by the frontend E2E tests (never Atlas).
# Start: npm run e2e:db:up    Stop and discard data: npm run e2e:db:down
services:
  e2e-mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 15
