# Local testing only: lets backend tests run from the host (e.g. scripts/run-backend-interface-tests.ps1)
# reach MySQL. Never used on EC2, only when named explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d mysql-db
#
# The db network is internal, and Docker won't publish ports for a container that is only on
# an internal network, so mysql-db also joins db-host here. The port is bound to 127.0.0.1 so
# only this machine can reach it. backend/tests/setupEnv.ts points host test runs at it.

services:
  mysql-db:
    networks:
      - db
      - db-host
    ports:
      - "127.0.0.1:3307:3306"

networks:
  db-host:
